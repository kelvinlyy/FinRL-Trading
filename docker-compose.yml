version: '3.8'

# Default web stack is now apps/frontend (3000) + apps/backend (8000).
# Legacy Streamlit service stays under profile "legacy-streamlit" on 8501.

services:
  backend:
    image: python:3.11-slim
    container_name: finrl-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace
    environment:
      - ENVIRONMENT=production
      - PYTHONPATH=/workspace/apps:/workspace:/workspace/src
    working_dir: /workspace
    command: >
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    networks:
      - finrl-network

  frontend:
    image: node:20-bullseye
    container_name: finrl-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
    working_dir: /workspace/apps/frontend
    command: >
      bash -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finrl-network

  streamlit-legacy:
    build: .
    container_name: finrl-trading-app
    profiles:
      - legacy-streamlit
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - ENVIRONMENT=production
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8501
      - PYTHONPATH=/app/src:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.path.insert(0, '/app/src'); import config; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - finrl-network

  # Optional: PostgreSQL database for production use
  postgres:
    image: postgres:15-alpine
    container_name: finrl-postgres
    environment:
      POSTGRES_DB: finrl_trading
      POSTGRES_USER: finrl_user
      POSTGRES_PASSWORD: finrl_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    profiles:
      - production
    networks:
      - finrl-network

  # Optional: Redis for advanced caching
  redis:
    image: redis:7-alpine
    container_name: finrl-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    profiles:
      - production
    networks:
      - finrl-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  finrl-network:
    driver: bridge
