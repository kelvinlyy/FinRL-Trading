strategy:
  name: adaptive_multi_asset_rotation
  version: v1.2.1
  base_frequency: daily
  rebalance_frequency: weekly
paths:
  data_root: ./data/fmp_daily
  output_root: ./src/strategies/output
  state_dir: ./src/strategies/output/state/adaptive_rotation
  audit_dir: ./src/strategies/output/audit/adaptive_rotation
  weights_dir: ./src/strategies/output/weights/adaptive_rotation
dates:
  start_date: 2017-01-01
  end_date: null
history:
  minimum_history_weeks: 26
benchmark:
  excess_return_benchmark: AAPL
  excess_return_benchmark_symbols:
  - AAPL
  - MSFT
  - NVDA
  - META
  - AMZN
  - GOOGL
  - TSLA
asset_groups:
  group_a_growth_tech:
    max_assets: 2
    symbols:
    - AAPL
    - MSFT
    - NVDA
    - META
    - AMZN
    - GOOGL
    - TSLA
  group_b_real_assets:
    max_assets: 2
    symbols:
    - XOM
    - CVX
    - COP
    - FCX
    - BHP
    - GLD
    - SLV
  group_c_defensive:
    max_assets: 2
    symbols:
    - TLT
    - IEF
    - XLU
    - XLV
    - IAU
    - SHY
    - UUP
market_regime:
  slow_regime:
    trend_ma_weeks: 26
    drawdown_weeks: 13
    drawdown_threshold: 0.1
    volatility:
      vix_lookback_years: 3
      vix_z_threshold: 3.0
    persistence_weeks: 2
    mapping:
      risk_on:
        risk_score: 0
        group_cap: 1.0
        cash_floor: 0.0
      neutral:
        risk_score: 1
        group_cap: 0.7
        cash_floor: 0.1
      risk_off:
        risk_score: 2
        group_cap: 0.5
        cash_floor: 0.3
fast_risk_off:
  price_shock:
    lookback_days: 3
    drawdown_threshold: -0.03
  volatility_shock:
    vix_z_threshold: 3.0
    delta_vix_z_threshold: 3.5
  behavior:
    group_cap: 0.3
    cash_floor: 0.5
    duration_days: 10
  stop_loss_multiplier: 0.7
group_strength:
  metric: risk_adjusted_return
  lookback_weeks: 12
  trend_filter: true
ranking:
  method: zscore
  robust: true
  top_n_per_group: 3
  zscore_window: 12
  max_zscore: 20.0
  min_mad_threshold: 1e-6
exception:
  z_threshold: 2.5
  lookback_weeks: 4
  min_trigger_count: 2
  reentry:
    cooldown_weeks: 6
    stricter_threshold_multiplier: 1.5
  strong_signal:
    enabled: true
    z_threshold: 3.5
    return_multiplier: 1.5
    return_lookback_weeks: 12
    require_positive_return: true
portfolio:
  max_active_groups: 2
  allow_exception: true
  exception_weight_multiplier: 1.5
  weighting:
    scheme: equal
    residual_to_cash: true
  fallback:
    enabled: true
    symbols:
    - SPY
    - QQQ
    - IAU
    - XLU
    - XLV
    allocation: equal
stop_loss:
  frequency: daily
  absolute:
    enabled: true
    threshold: -0.05
  trailing:
    enabled: true
    threshold: -0.1
cooldown:
  after_stop_days: 20
  block_reentry: true
state:
  persist_frequency: daily
  format: json
audit:
  enabled: true
  log_level: detailed
